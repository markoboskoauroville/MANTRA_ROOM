# drop-in: /etc/systemd/system/meditation-room-linux.service.d/mrbuffer.conf (installed by `mrbuffer on`, removed by `mrbuffer off`)
# The encoder renders AHEAD into the RAM ring instead of publishing in real time; mrbuffer-publish sends it.
[Unit]
Wants=mrbuffer-publish.service
Before=mrbuffer-publish.service

[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/lib/meditation-room-linux/mrbuffer.py encode
# the encoder may wait for the CPU (it has 20-30 s in hand); weight above an ordinary job, below the publisher
Nice=10
CPUWeight=400
CPUQuota=190%
