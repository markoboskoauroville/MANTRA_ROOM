<!doctype html>
<html><head><meta charset="utf-8"><title>milkrender</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="/vendor/butterchurn.min.js"></script>
<script src="/vendor/butterchurnPresets.min.js"></script>
<script>
// milkrender page: ONE MilkDrop preset (butterchurn 2.6.7, the desktop app's engine) rendered OFFLINE, frame by frame.
// Time is not the wall clock: every frame advances exactly 1/fps (render({elapsedTime})), and its sound is the 1024 samples
// of the meditation track that end at that frame's time. So a slow machine (2.7 fps) still makes a smooth 25 fps clip.
// Each frame is read back (readPixels in the same task as render) and POSTed to milkrender.py, which pipes it into x264.
"use strict";
(async function () {
  const q = new URLSearchParams(location.search);
  const post = (p, b) => fetch(p, { method: "POST", body: b }).then(r => r.ok).catch(() => false);
  window.onerror = (m, f, l) => { post("/fail", "js: " + m + " @" + l); };
  try {
    const BC = window.butterchurn.default || window.butterchurn;
    const BP = window.butterchurnPresets.default || window.butterchurnPresets;
    const ALL = BP.getPresets();
    if (q.get("list")) { await post("/keys", JSON.stringify(Object.keys(ALL))); return; }
    const W = +q.get("w") || 1280, H = +q.get("h") || 720, FPS = +q.get("fps") || 25, N = +q.get("frames") || 250;
    const SR = +q.get("sr") || 48000, WARM = +q.get("warm") || 50, SEND = q.get("send") !== "0";
    const key = q.get("preset");
    if (!ALL[key]) { await post("/fail", "no preset " + key); return; }
    const c = document.getElementById("c"); c.width = W; c.height = H;
    const actx = new (window.AudioContext || window.webkitAudioContext)();   // butterchurn wants one; nothing plays into it
    const viz = BC.createVisualizer(actx, c, { width: W, height: H, pixelRatio: 1, textureRatio: 1 });
    viz.loadPreset(ALL[key], 0);
    const pcm = new Uint8Array(await (await fetch("/pcm")).arrayBuffer());   // interleaved stereo u8 (128 = silence)
    const ns = pcm.length >> 1;
    const L = new Uint8Array(1024), R = new Uint8Array(1024), M = new Uint8Array(1024);
    const gl = c.getContext("webgl2") || c.getContext("webgl");
    const px = new Uint8Array(W * H * 4);
    let gpu = "?";
    try { const x = gl.getExtension("WEBGL_debug_renderer_info"); gpu = x ? gl.getParameter(x.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); } catch (e) {}
    post("/log", JSON.stringify({ gl: gpu, w: W, h: H }));
    const t0 = performance.now();
    let tl = t0;
    for (let k = 0; k < WARM + N; k++) {
      const end = Math.floor(k / FPS * SR);
      for (let i = 0; i < 1024; i++) {
        const s = end - 1024 + i;
        if (s >= 0 && s < ns) { L[i] = pcm[2 * s]; R[i] = pcm[2 * s + 1]; } else { L[i] = 128; R[i] = 128; }
        M[i] = (L[i] + R[i]) >> 1;
      }
      viz.render({ audioLevels: { timeByteArray: M, timeByteArrayL: L, timeByteArrayR: R }, elapsedTime: 1 / FPS });
      if (k >= WARM) {
        gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
        if (SEND) { if (!(await post("/frame", px))) return; }
        else if ((k & 7) === 0) await new Promise(r => setTimeout(r, 0));
      }
      if (k % 50 === 49) {
        const now = performance.now();
        post("/log", JSON.stringify({ k: k + 1, of: WARM + N, fps: 50000 / (now - tl) }));
        tl = now;
      }
    }
    await post("/done", JSON.stringify({ frames: N, warm: WARM, secs: (performance.now() - t0) / 1000 }));
  } catch (e) { post("/fail", "js: " + e); }
})();
</script>
</body></html>
