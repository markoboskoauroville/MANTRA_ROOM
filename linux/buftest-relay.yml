# PRIVATE test relay for the render-ahead buffer (mrbuffer.py): path buftest only, everything on 127.0.0.1.
# Never the public relay, never the mrlinux test relay (vmtest :8991). Run: mediamtx buftest-relay.yml
logLevel: warn
authMethod: internal
authInternalUsers:
  - {user: any, pass: "", ips: ["127.0.0.1", "::1"], permissions: [{action: publish, path: buftest}, {action: read}, {action: api}]}
api: true
apiAddress: 127.0.0.1:9997
metrics: false
pprof: false
playback: false
moq: false
rtsp: false
rtmp: false
webrtc: false
hls: true
hlsAddress: 127.0.0.1:8988
hlsVariant: lowLatency
srt: true
srtAddress: 127.0.0.1:8992
paths:
  buftest:
    source: publisher
    record: false
